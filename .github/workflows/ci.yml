name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Les bancs parametrables sont dans bench.yml (Actions > Bancs OpenTTD).
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # Explicit bash enables pipefail: tee must not hide a failed smoke.

jobs:
  smoke-test:
    name: "Étage 1: Smoke Test (3 graines x 2 ans)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (OpenTTD 15.3 runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip tar ca-certificates libgomp1 libglib2.0-0

      - name: Cache OpenTTDLab binaries & graphics
        uses: actions/cache@v4
        with:
          path: ~/.cache/OpenTTDLab
          key: openttdlab-${{ runner.os }}-${{ runner.arch }}-0.0.75-15.3-7.1

      - name: Test GitHub benchmark orchestration (no engine)
        run: python -m unittest discover -s sweeps -p test_github_bench.py -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Test & Plausibility Check
        run: |
          mkdir -p results/smoke_ci
          PYTHONUNBUFFERED=1 PYTHONPATH=sweeps python sweeps/smoke_test.py --seeds 42 100 7 --years 2 --max-workers 2 --out results/smoke_ci/bench.json 2>&1 | tee results/smoke_ci/console.log

      - name: Upload Smoke Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: results/smoke_ci/
          retention-days: 14
